name: CI (fork, GitHub-hosted)

# Authoritative fork CI: this fork has none of upstream's self-hosted enterprise
# runners (dsh-ubuntu-* / vm-backup / dsh-win-ci labels in ci.yml). It runs the
# fork-safe quality gate on GitHub-hosted Ubuntu and intentionally avoids the
# upstream enterprise/self-hosted runner lanes.

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-fork-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PRIMARY_NODE_VERSION: '24'
  # Never report to the production telemetry endpoint baked into
  # apps/cli/cordis.yml.
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  static:
    name: node 24 / static
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Source hygiene ratchet
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: pnpm run verify-source-hygiene

      - name: Static gates
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha || github.sha }}
        run: pnpm run check:ci:static

      - name: Unit tests
        env:
          NODE_ENV: test
          # The fork runner is Linux. Real PowerShell PTY coverage belongs to
          # the native Windows lane and is not deterministic on hosted Linux
          # images where pwsh may be installed incidentally.
          DSH_SKIP_REAL_PWSH_TESTS: '1'
        run: pnpm test -- --maxWorkers=2

      - name: Build
        run: pnpm run build:official

  generated-freshness:
    name: generated artifacts / freshness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Verify maintained generated artifacts are fresh
        run: pnpm run check:ci:generated

  all-checks-passed:
    name: all checks passed
    if: always()
    needs: [static, generated-freshness]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::Needed job results: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - name: All checks passed
        run: echo "All needed jobs succeeded (${{ join(needs.*.result, ', ') }})"
