name: Workflow discipline

on:
  # This check is a required branch-protection context, so it must be emitted
  # for every PR. Path filters would leave the required context absent on
  # ordinary source changes and block otherwise valid merges.
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Lint GitHub Actions
        uses: reviewdog/action-actionlint@2d3ea120f3f296da9b8b748e00c5e11f36db1f4d
        with:
          fail_level: error
          actionlint_flags: -config-file actionlint.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}