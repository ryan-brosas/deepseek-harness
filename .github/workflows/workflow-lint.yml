name: Workflow discipline

on:
  # This check is a required branch-protection context, so it must be emitted
  # for every PR. Path filters would leave the required context absent on
  # ordinary source changes and block otherwise valid merges.
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Lint GitHub Actions
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          actionlint_flags: -config-file actionlint.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}